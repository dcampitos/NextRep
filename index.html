<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>NextRep Rehab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<style>
/* Glass Aurora theme (dark, frosted glass on a violet/teal glow). Original layout concept: poster-style training log. Big condensed numerals, hard 2px rules, one orange block per screen.
   Points, levels and streaks sit inside that structure as thin bars and tags, never as decoration. */
:root{
  --bg:#0A0E1F; --surface:#151B38; --ink:#EEF1FF; --muted:#B6BEE0; --line:rgba(255,255,255,.18); --soft:rgba(255,255,255,.10);
  --accent:#38E8DC; --on-accent:#0A0E1F;
  --inv-bg:#1A2147; --inv-fg:#EEF1FF; --inv-muted:#B6BEE0;
  --alert:#FF8DB0; --ok:#6FE3A5;
  --bd:rgba(255,255,255,.22); --glass:rgba(255,255,255,.07); --grad:linear-gradient(135deg,#38E8DC,#9A7CFF);
  --display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.wrap.wide{max-width:1040px}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;font-weight:400}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 0}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.05em}
.brand small{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-left:8px}
.streak{display:flex;align-items:center;gap:6px;background:var(--inv-bg);color:var(--accent);border-radius:999px;padding:7px 12px;font-weight:700;font-size:12.5px;letter-spacing:.04em;white-space:nowrap}
.streak svg{flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:inline-flex;align-items:center;justify-content:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:14px;letter-spacing:.02em}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;padding:0;text-decoration:underline;font-weight:600;color:inherit}

/* hero */
.hero{padding-top:22px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,16vw,66px);line-height:.98;text-transform:uppercase;margin:8px 0 0;text-wrap:balance}
.hero h1 mark{display:inline-block;line-height:1.04;background:var(--accent);color:var(--on-accent);padding:2px 8px 0;margin:4px 0 0 -8px}

/* level card */
.level{margin-top:16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 0}
.level .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.level .lv{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.bar{height:10px;background:var(--line);margin-top:8px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);transition:width .5s ease}
.coach{margin-top:12px;display:flex;gap:10px;align-items:center;background:var(--soft);padding:10px 12px;font-size:13.5px}
.coach .av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{border:2px solid var(--line);background:transparent;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.day b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.day .dot.full{background:var(--accent)}
.day .dot.part{background:var(--ink)}
.day.sel{border-color:var(--ink);background:var(--ink);color:var(--inv-muted)}
.day.sel{color:var(--bg)}
.day.sel b{color:var(--bg)}
.day.today:not(.sel){border-color:var(--accent)}

/* block rows */
.list{margin-top:18px;border-top:2px solid var(--ink)}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item .n{font-family:var(--display);font-size:30px;width:44px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-family:var(--display);font-weight:400;font-size:21px;text-transform:uppercase}
.item .t span{font-size:12.5px;color:var(--muted)}
.item.done{color:var(--muted)}
.item.done .t b{text-decoration:line-through}
.chk{width:28px;height:28px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;border:2px solid var(--ink);padding:2px 7px;white-space:nowrap}
.tag.boss{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.xp{font-family:var(--display);font-size:16px;letter-spacing:.04em;white-space:nowrap}
.next{margin-top:14px;background:var(--inv-bg);color:var(--inv-fg);padding:16px}
.next .item{border:0;padding:0;color:inherit}
.next .item .n{color:var(--accent)}
.next .t span{color:var(--inv-muted)}
.next .btn{margin-top:14px}
.empty{margin-top:22px;padding:26px 18px;border:2px dashed var(--line);text-align:center;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--ink);display:flex;justify-content:center;padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px));z-index:20}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);border-top:4px solid transparent;margin-top:-2px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

/* cards, stats */
.card{background:var(--surface);border:2px solid var(--ink);padding:14px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{border-top:2px solid var(--ink);padding-top:8px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.h2{font-family:var(--display);font-weight:400;font-size:24px;text-transform:uppercase;margin:26px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.badge{border:2px solid var(--ink);padding:12px 10px;text-align:center;font-size:12.5px;font-weight:600;background:var(--surface)}
.badge .d{width:38px;height:38px;border-radius:50%;background:var(--accent);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.badge.locked{border-style:dashed;border-color:var(--line);color:var(--muted);background:transparent}
.badge.locked .d{background:var(--soft);color:var(--muted)}
.badge small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}

/* week list */
.wkday{border-top:2px solid var(--ink);padding:12px 0;display:flex;gap:14px;align-items:flex-start;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.wkday .d{width:54px;flex:none}
.wkday .d b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.wkday .d span{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;padding:4px 9px;background:var(--soft)}
.chip.done{background:var(--ink);color:var(--bg)}
.chip.t-strength{box-shadow:inset 3px 0 0 var(--accent)}
.chip.t-plyo{box-shadow:inset 3px 0 0 var(--alert)}

/* session */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet .wrap{padding-bottom:20px}
.shead{display:flex;align-items:center;gap:12px;padding-top:6px}
.shead .t{flex:1;min-width:0}
.video{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;background:var(--inv-bg);color:var(--inv-fg);text-decoration:none}
.video .play{width:54px;height:54px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.video b{display:block;font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase}
.video span{font-size:12.5px;color:var(--inv-muted)}
.novid{margin-top:14px;font-size:13px;color:var(--muted)}
.mv-name{font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,46px);line-height:1;text-transform:uppercase;margin:16px 0 8px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{border:2px solid var(--ink);padding:3px 9px;font-size:12.5px;font-weight:700}
.cue{margin-top:12px;background:var(--soft);padding:10px 12px;font-size:13.5px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-top:16px}
.setc{border:2px solid var(--line);padding:8px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.setc b{display:block;font-family:var(--display);font-weight:400;font-size:19px;color:var(--ink)}
.setc.done{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.setc.done b{color:var(--bg)}
.setc.now{border-color:var(--accent)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.step{border:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:6px;background:var(--surface)}
.step button{width:40px;height:40px;border:0;background:var(--soft);font-size:22px;line-height:1}
.step div{text-align:center}
.step div b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.step div span{font-size:11px;color:var(--muted);font-weight:600}
.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.feel button{min-height:44px;border:2px solid var(--line);background:transparent;font-weight:600;font-size:13px}
.feel button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.feel button.pain[aria-pressed="true"]{background:var(--alert);border-color:var(--alert);color:#fff}

/* celebration */
.cele{position:fixed;inset:0;z-index:60;background:var(--inv-bg);color:var(--inv-fg);display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));overflow:hidden}
.cele .in{position:relative;width:100%;max-width:480px;text-align:left}
.cele h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(48px,16vw,84px);line-height:.95;margin:8px 0 0;overflow-wrap:anywhere}
.cele h2 mark{display:inline-block;line-height:1.04;background:var(--accent);color:var(--on-accent);padding:2px 8px 0;margin:4px 0 0 -8px}
.cele .lvbig{font-family:var(--display);font-size:120px;line-height:1;color:var(--accent)}
.cele .row{display:flex;gap:22px;margin:22px 0}
.cele .row b{display:block;font-family:var(--display);font-weight:400;font-size:38px;line-height:1}
.cele .row span{font-size:12.5px;color:var(--inv-muted)}
.cele .bar{background:rgba(127,127,127,.35)}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;top:-20px;width:10px;height:18px;background:var(--accent);animation:fall 2.8s linear infinite}
.conf i:nth-child(3n){background:var(--inv-fg);width:8px;height:8px}
.conf i:nth-child(3n+1){background:var(--alert)}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.bar b{transition:none}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-fg);padding:10px 16px;font-weight:600;font-size:13.5px;max-width:90vw;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* gate */
.gate{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:30px 0}
.gate h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(56px,19vw,84px);line-height:.95;margin:0}
.gate h1 mark{display:inline-block;line-height:1.04;background:var(--accent);color:var(--on-accent);padding:2px 8px 0;margin:4px 0 0 -8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;min-height:46px;padding:9px 12px;border:2px solid var(--ink);background:var(--surface);border-radius:0}
textarea.input{min-height:72px;resize:vertical}
.code{letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-size:18px}
.err{color:var(--alert);font-weight:600;font-size:13.5px}
.proto{background:var(--soft);padding:10px 12px;font-size:12.5px;color:var(--muted)}

/* physio */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.pcard{background:var(--surface);border:2px solid var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.pcard .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard h3{font-family:var(--display);font-weight:400;font-size:26px;text-transform:uppercase;margin:0;line-height:1.05}
.flag{font-size:11.5px;font-weight:700;padding:3px 8px;border:2px solid var(--alert);color:var(--alert);white-space:nowrap}
.flag.nudge{border-color:var(--ink);color:var(--ink)}
.flag.ok{border-color:var(--ok);color:var(--ok)}
.seg{display:flex;border:2px solid var(--ink);margin-top:16px;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:10px 4px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;margin-top:12px}
.pday{background:var(--surface);border:2px solid var(--line);padding:10px}
.pday h4{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px;text-transform:uppercase}
.pday .chips{flex-direction:column;align-items:stretch}
.pchip{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--soft);padding:6px 6px 6px 9px;font-size:12.5px;font-weight:600}
.pchip button{border:0;background:none;width:26px;height:26px;font-size:16px;line-height:1;color:var(--muted)}
.addb{margin-top:8px;width:100%;min-height:36px;border:2px dashed var(--line);background:none;color:var(--muted);font-weight:700;font-size:12.5px}
.rowx{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rowx .l{min-width:0;flex:1 1 220px}
.rowx b{font-weight:700}
.invite{background:var(--inv-bg);color:var(--inv-fg);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.invite .c{font-family:var(--display);font-size:30px;letter-spacing:.12em;user-select:all}
.invite .s{font-size:12.5px;color:var(--inv-muted)}

/* modal */
.mback{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:100%;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));border:3px solid var(--ink)}
.panel h2{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase;margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mvbox{border:2px solid var(--line);background:var(--surface);padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.mvbox .r3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.mvbox .tools{display:flex;gap:6px;justify-content:flex-end}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--surface);padding:10px 12px;font-weight:700}
.pick button span{font-weight:400;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted)}
.hint.bad{color:var(--alert);font-weight:600}

/* leave-block pop-up */
.leave-back{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.leave-box{width:100%;max-width:380px;padding:20px;border:2px solid var(--ink);background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* account menu */
.icon-btn.sm{width:36px;height:36px}
.menu-back{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.menu-box{width:100%;max-width:340px;padding:20px;border:2px solid var(--ink);background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;margin-top:14px;border:2px solid var(--ink);background:#000}
.vwrap.short{aspect-ratio:9/16;width:min(100%,calc(44vh * 9 / 16));margin-inline:auto}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{display:inline-block;margin-top:8px;font-size:13px;color:var(--muted);text-decoration:underline}

.heat{display:grid;grid-template-columns:62px repeat(7,1fr);gap:5px;align-items:center}
.heat .hd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em}
.heat .wl{font-size:11px;color:var(--muted);line-height:1.2}
.dc{position:relative;height:38px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);font-weight:700;font-size:15px}
.dc .dn{position:absolute;top:2px;left:4px;font-size:9px;font-weight:600;opacity:.8}
.dc.full{background:var(--accent);color:var(--on-accent)}
.dc.part{background:linear-gradient(135deg,var(--accent) 50%,var(--soft) 50%);color:var(--ink)}
.dc.pain{background:var(--alert);color:var(--bg)}
.dc.fut{background:transparent;border:1.5px dashed var(--line)}
.dc.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{gap:8px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;background:var(--soft)}
.sw.full{background:var(--accent)}
.sw.part{background:linear-gradient(135deg,var(--accent) 50%,var(--soft) 50%)}
.sw.pain{background:var(--alert)}
.sw.today{background:transparent;outline:2px solid var(--ink);outline-offset:0}

.mhint{margin-top:18px;font-size:13px;color:var(--muted)}
.mchips{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:6px;position:relative;scrollbar-width:thin}
.mchip{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:44px;max-width:210px;padding:0 12px 0 8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:600 14px var(--body, inherit);cursor:pointer}
.mchip b{display:grid;place-items:center;width:24px;height:24px;background:var(--soft);font-size:13px}
.mchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip.cur{background:var(--ink);color:var(--bg);opacity:1}
.mchip.cur b{background:var(--accent);color:var(--on-accent)}
.mchip.done{border-color:var(--line);color:var(--muted);opacity:1}
.mchip.done b{background:var(--accent);color:var(--on-accent)}
.mchip:disabled{cursor:default}
.mchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.segs{display:flex;gap:6px;margin-top:20px}
.segs i{flex:1;height:10px;background:var(--line)}
.segs i.on{background:var(--accent)}
.segs i.cur{background:var(--ink)}
.rvs{display:flex;flex-direction:column;margin-top:14px;border-top:2px solid var(--ink)}
.rv{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.rvt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rvt b{font-size:16px}
.rv .vlink{margin-top:2px;width:max-content}
.rvlink{display:inline-flex;align-items:center;gap:8px;width:max-content;margin-top:6px;padding:8px 12px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;text-decoration:none}
.rvlink svg{fill:currentColor}
.rvno{margin-top:4px;font-size:13px;color:var(--muted)}
.pbar{margin-top:20px}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:600 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pchip b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;background:var(--soft);font-size:12px}
.pchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pchip[aria-pressed="true"] b{background:var(--accent);color:var(--on-accent)}
.pchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.who{min-width:0;display:flex;flex-direction:column;gap:1px}
.wname{font-size:12.5px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.item2{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.item2 .item{border-bottom:0;flex:1;min-width:0}
.mvbtn{flex:none;min-height:40px;padding:0 12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:700 13px var(--body);cursor:pointer}
.mvlink{display:block;width:100%;margin-top:10px;min-height:44px;background:none;border:2px solid var(--inv-fg);color:var(--inv-fg);font:700 14px var(--body);cursor:pointer}
.mvopts{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.mvopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:48px;padding:8px 12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);text-align:left;font-family:var(--body);cursor:pointer}
.mvopt b{font-size:15px}
.mvopt span{font-size:12.5px;color:var(--muted)}
.mvopt:disabled{border-color:var(--line);cursor:default;opacity:.7}
.mvbtn:focus-visible,.mvlink:focus-visible,.mvopt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.dashwrap{margin-top:14px;overflow:auto;max-height:calc(100vh - 230px);min-height:260px;border:2px solid var(--ink);background:var(--surface)}
.dash{display:grid;grid-template-columns:minmax(96px,130px) repeat(14,minmax(28px,1fr)) minmax(96px,120px);gap:4px;align-items:center;padding:0 10px 10px 0;min-width:760px}
.dh{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1}
.dh b{display:block;font-size:12px;color:var(--ink)}
.dh.tdy b{text-decoration:underline}
.dn{background:none;border:0;padding:0;text-align:left;font:700 14px var(--body);color:var(--ink);text-decoration:underline;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd{position:relative;height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted)}
.dd.full{background:var(--accent);color:var(--on-accent)}
.dd.part{background:linear-gradient(135deg,var(--accent) 50%,var(--soft) 50%);color:var(--ink)}
.dd.miss{background:transparent;border:2px solid var(--alert);color:var(--alert)}
.dd.fut{background:transparent;border:1.5px dashed var(--line)}
.dd.rest{background:transparent;border:1px solid var(--line)}
.dd.tdy{outline:2px solid var(--ink);outline-offset:1px}
.dd .pn{position:absolute;top:-4px;right:-4px;width:14px;height:14px;display:grid;place-items:center;background:var(--alert);color:var(--bg);font:700 10px var(--body);font-style:normal}
.dtot{font-size:12.5px;font-weight:700;line-height:1.2}
.dtot.bad{color:var(--alert)}
.dtot small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.dlegend{margin-top:12px}
.sw.miss{background:transparent;border:2px solid var(--alert)}

.acct{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:76px}
.acname{font-size:11px;font-weight:700;color:var(--muted);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{overflow:hidden;padding:0}
.avimg{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.prac{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0;margin-top:2px}
.prac img{height:20px;max-width:56px;object-fit:contain;flex:0 0 auto}
.prac span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phrow{display:flex;align-items:center;gap:14px}
.phav{width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.phav.sq{border-radius:6px;width:96px}
.phav.sq .avimg{border-radius:0;object-fit:contain}
.filebtn{cursor:pointer}

.dh{position:sticky;top:0;z-index:3;background:var(--surface);padding:10px 0 6px;box-shadow:0 3px 0 var(--surface)}
.dh.corner{left:0;z-index:5;text-align:left;padding-left:10px}
.dn{position:sticky;left:0;z-index:2;background:var(--surface);padding:6px 6px 6px 10px;box-shadow:4px 0 0 var(--surface)}
button.dd{border:0;padding:0;font-family:var(--body);cursor:pointer}
button.dd.miss{border:2px solid var(--alert)}
button.dd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dn{align-self:stretch;display:flex;align-items:center;box-shadow:4px 0 0 var(--surface),0 4px 0 var(--surface),0 -4px 0 var(--surface)}
.dh.corner{box-shadow:4px 3px 0 var(--surface);align-self:stretch;display:flex;align-items:flex-end}

.painrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600}
.pbtn{min-height:36px;padding:0 12px;border:2px solid var(--ink);background:transparent;font:700 13px var(--body);color:var(--ink)}
.pbtn.on{background:var(--alert);border-color:var(--alert);color:var(--bg)}

.prac{margin-top:12px;gap:10px;font-size:14px;line-height:1.25;align-items:center}
.prac img{height:36px;max-width:96px}
.prac span{overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere}
.top .brand{font-size:28px;line-height:1;flex:0 0 auto}
.sqd{display:inline-block;width:.17em;height:.17em;background:currentColor;margin-left:.08em;vertical-align:baseline}

.top .brand{font-size:38px}
.prac{margin-top:8px;gap:8px;font-size:12.5px}
.prac img{height:26px;max-width:72px}
button.phav{padding:0;background:none;cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.zbox{position:relative;width:min(86vw,340px);height:min(86vw,340px);background:var(--surface);border:3px solid var(--ink)}
.zbox img{width:100%;height:100%;object-fit:cover;display:block}
.zx{position:absolute;top:-16px;right:-16px;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font:700 22px/1 var(--body);cursor:pointer}

.top .brand{white-space:nowrap}
.srt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===================== GLASS AURORA OVERRIDES ===================== */
html{background:#0A0E1F}
body{background-color:#0A0E1F;background-image:radial-gradient(520px 420px at 92% -4%,rgba(124,92,255,.5),transparent 70%),radial-gradient(460px 420px at -6% 30%,rgba(0,214,201,.3),transparent 70%),radial-gradient(520px 460px at 100% 78%,rgba(255,92,170,.22),transparent 70%);background-attachment:fixed;background-repeat:no-repeat;font-size:14.5px}
:focus-visible{outline-color:#9A7CFF}
.disp,.hero h1,.item .t b,.video b,.mv-name,.h2,.pday h4,.pcard h3,.panel h2,.gate h1,.cele h2,.btn.big,.stat b,.day b,.wkday .d b,.setc b,.step div b,.cele .row b,.cele .lvbig,.item .n,.xp,.invite .c,.level .lv{font-family:var(--display);text-transform:none;font-weight:800;letter-spacing:-.025em}
.brand{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:26px;text-transform:uppercase}
.top .brand,.top .brand{font-size:26px}
.sqd{background:var(--accent);border-radius:3px}
.eyebrow{letter-spacing:.12em}
.hero h1{font-size:clamp(34px,10.5vw,44px);line-height:1.08}
.hero h1 mark,.cele h2 mark,.gate h1 mark{background:none;color:transparent;background-image:var(--grad);-webkit-background-clip:text;background-clip:text;padding:0;margin:0;display:inline}
.mv-name{font-size:clamp(28px,8.5vw,38px)}
.h2,.panel h2{font-size:22px}
.item .t b{font-size:17px}
.item .n{font-size:22px;width:44px;height:44px;flex:none;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.pcard h3{font-size:22px}
.gate h1{font-size:clamp(40px,13vw,58px)}
.cele h2{font-size:clamp(38px,12vw,62px)}

/* glass surfaces */
.card,.pcard,.pday,.dashwrap,.mvbox,.seg,.badge,.step,.next,.coach,.level,.invite,.painrow,.empty,.proto,.video,.rvs{border-radius:20px}
.card,.pcard,.badge,.step,.mvbox,.seg,.pday,.dashwrap{background:var(--glass);border:1px solid var(--bd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dashwrap{background:var(--surface)}
.badge.locked{background:transparent;border-style:dashed}
.level{margin-top:16px;border:1px solid var(--bd);background:var(--glass);padding:14px 16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.level .lv{font-size:17px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.14)}
.bar b{border-radius:99px;background:var(--grad)}
.coach{background:var(--glass);border:1px solid var(--bd);padding:12px 14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.coach .av{background:var(--grad);color:var(--on-accent);width:32px;height:32px;font-weight:800}
.cue,.proto{background:var(--glass);border:1px solid var(--bd);border-radius:14px}
.empty{border:1px dashed var(--bd);border-radius:20px}

/* top bar + buttons */
.streak{background:var(--glass);border:1px solid var(--bd);color:#FFC38A;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.icon-btn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:var(--ink)}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:var(--ink);border-radius:999px;font-weight:600}
.btn.ink{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.accent{background:var(--grad);color:var(--on-accent);border-color:transparent;font-weight:700;box-shadow:0 8px 24px rgba(124,92,255,.35)}
.btn.big{font-size:17px;letter-spacing:-.01em}
.btn.danger{border-color:var(--alert);color:var(--alert);background:transparent}
.link{color:var(--accent)}
.tag{border:1px solid var(--bd);border-radius:999px;padding:2px 9px}
.tag.boss{background:var(--grad);border-color:transparent;color:var(--on-accent)}
.chk{background:var(--grad);color:var(--on-accent);border-radius:10px}
.mvbtn,.pbtn,.mvlink{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:var(--ink);border-radius:999px}
.pbtn.on{background:var(--alert);border-color:var(--alert);color:var(--bg)}
.mvlink{border-color:rgba(255,255,255,.4)}

/* day strip, list */
.day{border:1px solid var(--bd);background:var(--glass);border-radius:16px;padding:8px 0 9px;color:var(--muted)}
.day b{color:var(--ink);font-size:17px}
.day .dot.full{background:var(--accent)}
.day .dot.part{background:#9A7CFF}
.day.sel{background:var(--grad);border-color:transparent;color:var(--on-accent)}
.day.sel b{color:var(--on-accent)}
.day.today:not(.sel){border-color:var(--accent)}
.list{border-top:0;display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--bd);border-radius:20px;background:var(--glass);padding:12px 14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.item2{border:0;gap:8px}
.item2 .item{border:1px solid var(--bd)}
.item.done{background:rgba(56,232,220,.12);border-color:rgba(56,232,220,.4)}
.item.done .n{background:var(--grad);color:var(--on-accent)}
.next{background:var(--glass);border:1px solid rgba(56,232,220,.55);color:var(--ink);padding:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.next .item{background:none;border:0;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.next .item .n{color:var(--accent);background:var(--soft)}
.next .t span{color:var(--muted)}
.video{background:var(--glass);border:1px solid var(--bd);color:var(--ink);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.video .play{background:var(--grad);border-radius:16px}
.video span{color:var(--muted)}

/* tab bar */
.tabs{background:rgba(10,14,31,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--bd)}
.tabs button{border-top:0;margin-top:0;font-size:11.5px;padding:11px 0 10px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* stats, badges, week */
.stat{border-top:0;background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.stat b{font-size:28px}
.badge{border:1px solid var(--bd)}
.badge .d{background:var(--grad)}
.wkday{border:1px solid var(--bd);border-radius:20px;background:var(--glass);padding:12px 14px;margin-top:8px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chip{border-radius:999px;padding:4px 11px}
.chip.done{background:var(--grad);color:var(--on-accent)}
.chip.t-strength,.chip.t-plyo{box-shadow:none;border:1px solid var(--bd)}
.chip.t-strength{border-color:var(--accent)}
.chip.t-plyo{border-color:var(--alert)}

/* session */
.sheet{background:#0A0E1F;background-image:radial-gradient(520px 420px at 92% -4%,rgba(124,92,255,.5),transparent 70%),radial-gradient(460px 420px at -6% 30%,rgba(0,214,201,.3),transparent 70%),radial-gradient(520px 460px at 100% 78%,rgba(255,92,170,.22),transparent 70%)}
.facts span{border:1px solid var(--bd);border-radius:999px;background:var(--glass)}
.setc{border:1px solid var(--bd);border-radius:14px;background:var(--glass)}
.setc.done{background:var(--grad);border-color:transparent;color:var(--on-accent)}
.setc.done b{color:var(--on-accent)}
.setc.now{border-color:var(--accent)}
.step button{border-radius:12px;background:rgba(255,255,255,.12)}
.feel button{border:1px solid var(--bd);border-radius:14px;background:var(--glass)}
.feel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.feel button.pain[aria-pressed="true"]{background:var(--alert);color:#0A0E1F}
.vwrap{border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.mchip{border:1px solid var(--bd);border-radius:999px;background:var(--glass)}
.mchip b{border-radius:50%}
.mchip.cur{background:var(--ink);color:var(--bg)}
.mchip.cur b,.mchip.done b{background:var(--grad);color:var(--on-accent)}
.pchip{border:1px solid var(--bd);border-radius:999px;background:var(--glass);color:var(--ink)}
.pchip b{border-radius:99px}
.pchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.segs i{border-radius:99px;height:8px}
.segs i.on{background:var(--grad)}
.segs i.cur{background:var(--ink)}
.rvs{border:0}
.rv{border-bottom:1px solid var(--line)}
.rvlink{background:var(--glass);border:1px solid var(--bd);color:var(--ink);border-radius:999px}
.mvopt,.pick button{border:1px solid var(--bd);border-radius:16px;background:var(--glass)}
.mvopt:disabled{border-color:var(--line)}
.painrow{border:1px solid var(--bd);background:var(--glass)}

/* celebration */
.cele{background:#0A0E1F;background-image:radial-gradient(520px 420px at 92% 0%,rgba(124,92,255,.6),transparent 70%),radial-gradient(460px 420px at 0% 70%,rgba(0,214,201,.4),transparent 70%),radial-gradient(520px 460px at 100% 100%,rgba(255,92,170,.3),transparent 70%);color:var(--ink)}
.cele .lvbig{color:var(--accent)}
.cele .row span{color:var(--muted)}
.conf i{background:var(--accent)}
.conf i:nth-child(3n){background:var(--ink)}
.conf i:nth-child(3n+1){background:#9A7CFF}

/* forms */
.input{border:1px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.08);color:var(--ink)}
.input::placeholder{color:var(--muted);opacity:.8}
select.input option{background:#151B38;color:var(--ink)}
.field label{letter-spacing:.1em}
.seg{border-radius:999px;overflow:hidden}
.seg button{border-radius:999px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.invite{background:var(--glass);border:1px solid var(--bd);color:var(--ink);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.invite .s{color:var(--muted)}
.flag{border:1px solid var(--alert);border-radius:999px}
.flag.nudge{border-color:var(--bd);color:var(--ink)}
.addb{border:1px dashed var(--bd);border-radius:12px}
.pchip button{color:var(--muted)}

/* modals */
.mback,.menu-back,.leave-back{background:rgba(5,8,20,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.panel{background:#10162F;background-image:radial-gradient(360px 260px at 100% 0%,rgba(124,92,255,.3),transparent 70%),radial-gradient(320px 260px at 0% 100%,rgba(0,214,201,.18),transparent 70%);border:1px solid var(--bd);border-radius:26px}
.leave-box,.menu-box{border:1px solid var(--bd);border-radius:24px;background:rgba(21,27,56,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.zbox{border:1px solid var(--bd);border-radius:24px;overflow:hidden}

/* builds the plan record for a new patient. opts: name, age, injury, goal, physio, template, code, sample */
function buildPlan(o, now) {

  const start = o.template === 'acl' && o.sample ? addDays(mondayOf(now), -17 * 7) : mondayOf(now);
  const weeks = {};
  if (blocks.length) {

    for (let k = from; k <= 3; k++) weeks[dstr(addDays(mondayOf(now), k * 7))] = weekFromPattern(blocks);
  }
  const code = o.code || makeCode(o.name);

    physio: o.physio || 'Your physio', note: 'Slow and controlled. Mind to muscle. Pain-free range only.',
    appointment: '', started: dstr(start), blocks: blocks, weeks: weeks, painReviewedAt: 0,

}

function blockXp(b) {

/* builds twelve days of finished sessions so the sample patient has a streak, XP and one pain flag */
function sampleLog(plan, now) {
  const log = {};
  const bm = {}; plan.blocks.forEach(b => { bm[b.id] = b; });
  for (let back = 12; back >= 1; back--) {
    const d = addDays(now, -back); const ds = dstr(d);
    const w = plan.weeks[weekKey(d)]; if (!w) continue;
    const ids = w['d' + ((d.getDay() + 6) % 7)] || [];
    ids.forEach(id => {
      const b = bm[id]; if (!b || b.type === 'recovery') return;
      const items = {};

        const sets = [];
        const n = it.unit === 'check' ? 0 : it.sets;
        for (let s = 0; s < n; s++) sets.push({ r: it.reps, kg: it.weighted ? 20 + (12 - back) : 0 });
        const pain = back === 5 && it.name === 'Leg extension';

      if (!log[ds]) log[ds] = {};

/* ===== appointment reminders (48 h and 24 h, shown once at login) ===== */
function apptKey(P, h) { return String(P.appointment) + '|' + h; }
function dueReminder(P) {
  if (!P.appointment) return null;
  const t = new Date(P.appointment).getTime(); if (isNaN(t)) return null;
  const hrs = (t - Date.now()) / 36e5; if (hrs <= 0 || hrs > 48) return null;
  const acks = (S.logDoc && S.logDoc.acks) || {};
  const sameDay = dstr(new Date(t)) === todayStr();
  const due = [48, 24, 'day'].filter(h => (h === 'day' ? sameDay : hrs <= h) && !acks[apptKey(P, h)]);
  if (!due.length) return null;
  return { hrs: hrs, level: due[due.length - 1], keys: due.map(h => apptKey(P, h)) };
}
function hrsText(h) {
  if (h < 1) return 'less than an hour';
  const hh = Math.round(h); if (hh < 24) return hh + ' hour' + (hh === 1 ? '' : 's');
  const dd = Math.floor(hh / 24), r = hh % 24;
  return dd + ' day' + (dd === 1 ? '' : 's') + (r ? ' ' + r + ' hour' + (r === 1 ? '' : 's') : '');
}
function remindView() {
  const P = PP(); const r = S.remind; const ap = fmtAppt(P.appointment);
  return '<div class="leave-back" role="presentation"><div class="leave-box remind" role="alertdialog" aria-labelledby="rmT" aria-describedby="rmD">' +
    '<div class="eyebrow">' + (r.level === 'day' ? 'Appointment today' : r.level + ' hour reminder') + '</div>' +
    '<b id="rmT" class="disp" style="font-size:30px;display:block;margin-top:6px;line-height:1.05">' + (r.level === 'day' ? 'Physio visit today at ' + esc(ap.text.split(', ').pop()) : 'Physio visit in ' + esc(hrsText(r.hrs))) + '</b>' +
    '<div id="rmD" style="font-size:15px;margin:12px 0 4px"><b>' + esc(ap.text) + '</b>' + (r.level === 'day' ? ' (in ' + esc(hrsText(r.hrs)) + ')' : '') + (P.physio ? ' with ' + esc(P.physio) : '') + '</div>' +
    '<div class="muted" style="font-size:13.5px;margin-bottom:16px">Keep logging your exercises. Your physio can see your progress and any pain you flag.</div>' +
    '<div class="actions" style="margin-top:0"><button class="btn accent big block" data-act="remindok">Got it</button></div></div></div>';
}

    else if (kind === 'mephoto') readImage(file, 192, false, async u => {
      S.logDoc = Object.assign({}, S.logDoc, { id: S.code, log: (S.logDoc && S.logDoc.log) || {}, photo: u }); render(); renderOverlay();
      try { await Store.setDoc('logs', S.code, S.logDoc); } catch (x) { reportErr(x); }
    });
    else if (kind === 'pphoto') readImage(file, 192, false, async u => {
      const id = S.sel; const ld = Object.assign({ id: id, log: {} }, S.logs[id] || {}, { photo: u });
      try { await Store.setDoc('logs', id, ld); showToast('Photo saved'); } catch (x) { reportErr(x); }
    });
    return;
  }
  const t = e.target; if (!t.dataset || !t.dataset.f) return;
  if (t.dataset.rerender && S.draft) { setPath(S.draft, t.dataset.f, t.value); renderModal(); }
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'mback') { if (e.target === el) { S.modal = null; renderModal(); } return; }
  const P = (S.role === 'patient' || S.sel) ? PP() : null;
  switch (a) {
    case 'join': joinWithCode($('#codeIn').value); break;
    case 'physio': enterPhysio(); break;
    case 'signout': signOut(); break;
    case 'tab': S.tab = d.tab; render(); window.scrollTo(0, 0); break;
    case 'pickday': S.date = d.ds; S.tab = 'today'; render(); window.scrollTo(0, 0); break;
    case 'weekprev': S.weekOff--; render(); break;
    case 'weeknext': S.weekOff++; render(); break;
    case 'weekthis': S.weekOff = 0; render(); break;
    case 'start': startSession(S.date || todayStr(), d.bid); break;
    case 'remindok': {
      const acks = Object.assign({}, (S.logDoc && S.logDoc.acks) || {});
      (S.remind ? S.remind.keys : []).forEach(k => { acks[k] = Date.now(); });
      S.logDoc = Object.assign({}, S.logDoc, { id: S.code, log: (S.logDoc && S.logDoc.log) || {}, acks: acks }); S.remind = null; renderOverlay();
      try { await Store.setDoc('logs', S.code, S.logDoc); } catch (x) { reportErr(x); }
      break;
    }
    case 'place': S.place = d.p || ''; render(); break;
    case 'moveopen': S.moveSel = { ds: S.date || todayStr(), bid: d.bid }; renderOverlay(); break;
    case 'moveclose': S.moveSel = null; renderOverlay(); break;
    case 'moveback': if (e.target === el) { S.moveSel = null; renderOverlay(); } break;
    case 'moveto': { const m = S.moveSel; if (m) { await applyMove(m.ds, m.bid, d.to); const t = parseD(d.to); showToast('Moved to ' + DAYS[(t.getDay() + 6) % 7] + ' ' + t.getDate() + ' ' + MONTHS[t.getMonth()] + '.'); } break; }
    case 'review': S.review = { ds: S.date || todayStr(), bid: d.bid }; renderOverlay(); break;
    case 'reviewclose': S.review = null; renderOverlay(); break;
    case 'redo': S.review = null; startSession(d.ds, d.bid); break;
    case 'untick': {
      const log = clone((S.logDoc && S.logDoc.log) || {});
      if (log[d.ds]) { delete log[d.ds][d.bid]; if (!Object.keys(log[d.ds]).length) delete log[d.ds]; }
      S.logDoc = Object.assign({}, S.logDoc, { id: S.code, log: log }); S.review = null; render();
      try { await Store.setDoc('logs', S.code, S.logDoc); } catch (e) { reportErr(e); }
      break;
    }
    case 'tick': {
      const ds = S.date || todayStr(); const log = clone((S.logDoc && S.logDoc.log) || {}); log[ds] = log[ds] || {};
      log[ds][d.bid] = { done: true, at: Date.now(), xp: 0, boss: false, items: {} };
      S.logDoc = Object.assign({}, S.logDoc, { id: S.code, log: log }); S.review = null; render(); showToast('Recovery logged.');
      try { await Store.setDoc('logs', S.code, S.logDoc); } catch (x) { reportErr(x); } break;
    }
    case 'closesession': S.session.leave = true; renderOverlay(); break;
    case 'menu': S.menu = true; renderOverlay(); break;
    case 'photoview': { if (P && P.photo) showZoom(P.photo); break; }
    case 'rmmephoto': {
      S.logDoc = Object.assign({}, S.logDoc, { id: S.code, log: (S.logDoc && S.logDoc.log) || {}, photo: '' });
      if (S.plan && S.plan.photo) { /* physio-set photo stays as fallback */ }
      render(); renderOverlay(); try { await Store.setDoc('logs', S.code, S.logDoc); } catch (x) { reportErr(x); } break;
    }
    case 'rmpphoto': {
      const id = S.sel; const ld = Object.assign({ id: id, log: {} }, S.logs[id] || {}, { photo: '' });
      try { await Store.setDoc('logs', id, ld); if (S.plans[id] && S.plans[id].photo) editPlan(p => { p.photo = ''; }); } catch (x) { reportErr(x); } break;
    }
    case 'daydetail': S.modal = { type: 'day', id: d.id, ds: d.ds }; renderModal(); break;
    case 'dayreviewed': { const p = clone(S.plans[d.id]); p.painReviewedAt = Date.now(); await savePlan(p); renderModal(); showToast('Marked as reviewed'); break; }
    case 'practice': S.draft = { __for: 'practice', name: (S.practice && S.practice.name) || '', logo: (S.practice && S.practice.logo) || '' }; S.modal = { type: 'practice' }; renderModal(); break;
    case 'rmlogo': if (S.draft) { S.draft.logo = ''; renderModal(); } break;
    case 'savepractice': {
      const D = S.draft; const doc = { name: String(D.name || '').trim(), logo: D.logo || '' };
      try { await Store.setDoc('meta', 'practice', doc); S.practice = doc; } catch (x) { reportErr(x); }
      S.modal = null; S.draft = null; renderModal(); render(); showToast('Practice saved'); break;
    }
    case 'menuclose': S.menu = false; renderOverlay(); break;
    case 'menuback': if (e.target === el) { S.menu = false; renderOverlay(); } break;
    case 'keepgoing': S.session.leave = false; renderOverlay(); break;
    case 'leaveback': if (e.target === el) { S.session.leave = false; renderOverlay(); } break;
    case 'leave': S.session = null; renderOverlay(); break;
    case 'adj': { const s = S.session; const k = d.k; const dl = Number(d.d); s[k] = Math.max(k === 'kg' ? 0 : 1, Math.round((s[k] + dl) * 10) / 10); renderOverlay(); break; }
    case 'logset': {
      const s = S.session; const c = curMove();
      s.sets.push({ r: s.reps, kg: c.it.weighted ? s.kg : 0 });
      if (s.sets.length >= c.it.sets) s.stage = 'feel';
      renderOverlay(); break;
    }
    case 'feel': S.session.feel = d.v; renderOverlay(); break;
    case 'nextmove': {
      const s = S.session; const c = curMove();
      s.data[c.it.id] = c.it.unit === 'check' ? { sets: [], feel: s.feel === 'pain' ? 'pain' : 'ok', pain: s.feel === 'pain' } : { sets: s.sets, feel: s.feel, pain: s.feel === 'pain' };
      const items = c.b.items;
      if (Object.keys(s.data).length >= items.length) { finishBlock(); break; }
      let nx = -1;
      for (let k = 1; k <= items.length; k++) { const j = (s.idx + k) % items.length; if (!s.data[items[j].id]) { nx = j; break; } }
      s.idx = nx; initMove(); renderOverlay(); window.scrollTo(0, 0); savePartial();
      break;
    }
    case 'undomove': {
      const s = S.session; const c = curMove(); delete s.data[c.it.id]; delete s.prog[c.it.id]; initMove(); renderOverlay(); savePartial(); showToast('Marked as not done'); break;
    }
    case 'painflag': { const s = S.session; s.feel = s.feel === 'pain' ? 'ok' : 'pain'; renderOverlay(); break; }
    case 'gomove': {
      const s = S.session; stashMove(); s.idx = Number(d.i); initMove(); renderOverlay(); window.scrollTo(0, 0); break;
    }
    case 'celeclose': S.cele = null; render(); window.scrollTo(0, 0); break;

    /* physio */
    case 'openpatient': S.modal = null; renderModal(); S.sel = d.id; S.ptab = d.t || 'plan'; S.pweek = ''; S.draft = null; render(); window.scrollTo(0, 0); break;
    case 'pview': S.pview = d.v; render(); break;
    case 'dashmove': S.dashOff = Math.min(0, (S.dashOff || 0) + Number(d.d)); render(); break;
    case 'back': S.sel = null; S.draft = null; render(); break;
    case 'ptab': S.ptab = d.t; S.draft = null; render(); break;
    case 'copycode': copyText(P ? P.code : S.plans[S.modal && S.modal.id].code, 'Code'); break;
    case 'copymsg': { const q = S.plans[S.modal.id]; copyText('Hi ' + q.name + ', your NextRep plan is ready. Open NextRep and type this code: ' + q.code, 'Message'); break; }
    case 'pwk': { const cur = S.pweek ? parseD(S.pweek) : mondayOf(new Date()); S.pweek = dstr(addDays(cur, 7 * Number(d.d))); render(); break; }
    case 'copyweek': {
      const cur = S.pweek ? parseD(S.pweek) : mondayOf(new Date()); const ck = dstr(cur), pk = dstr(addDays(cur, -7));
      const has = P.weeks && P.weeks[ck] && Object.keys(P.weeks[ck]).some(k => P.weeks[ck][k].length);
      const run = () => { editPlan(p => { p.weeks = p.weeks || {}; p.weeks[ck] = clone(p.weeks[pk]); }); showToast('Copied last week'); };
      if (has) { S.modal = { type: 'confirm', title: 'Replace this week?', body: 'This week already has blocks. Copying last week will replace them.', yes: 'Replace', danger: true, fn: run }; renderModal(); } else run();
      break;
    }
    case 'addb': S.modal = { type: 'pick', day: Number(d.day) }; renderModal(); break;
    case 'pickb': {
      const day = S.modal.day, ck = dstr(S.pweek ? parseD(S.pweek) : mondayOf(new Date()));
      S.modal = null; editPlan(p => { p.weeks = p.weeks || {}; p.weeks[ck] = p.weeks[ck] || emptyWeek(); p.weeks[ck]['d' + day].push(d.bid); }); break;
    }
    case 'rmb': {
      const ck = dstr(S.pweek ? parseD(S.pweek) : mondayOf(new Date()));
      editPlan(p => { const arr = p.weeks[ck]['d' + d.day]; const i = arr.indexOf(d.bid); if (i >= 0) arr.splice(i, 1); }); break;
    }
    case 'newblockday': openBlockModal(null, S.modal.day); break;
    case 'newblock': openBlockModal(null, null); break;
    case 'editblock': openBlockModal(d.bid, null); break;
    case 'dupblock': editPlan(p => { const b = clone(p.blocks.find(x => x.id === d.bid)); b.id = uid('b'); b.name += ' copy'; b.items.forEach(i => { i.id = uid('i'); }); p.blocks.push(b); }); showToast('Block duplicated'); break;
    case 'addmv': S.draft.items.push(mv('', 3, 10, 'reps')); renderModal(); break;
    case 'mvrm': S.draft.items.splice(Number(d.i), 1); renderModal(); break;
    case 'mvup': { const i = Number(d.i), it = S.draft.items; [it[i - 1], it[i]] = [it[i], it[i - 1]]; renderModal(); break; }
    case 'mvdown': { const i = Number(d.i), it = S.draft.items; [it[i + 1], it[i]] = [it[i], it[i + 1]]; renderModal(); break; }
    case 'saveblock': {
      const b = clone(S.draft); S.err = '';
      if (!String(b.name).trim()) S.err = 'Give the block a name.';
      else if (!b.items.length) S.err = 'Add at least one move.';
      else if (b.items.some(i => !String(i.name).trim())) S.err = 'Every move needs a name.';
      let badVid = false;
      b.items.forEach(i => { const c = ytCanon(i.video); i.__bad = c === null; if (c === null) badVid = true; else i.video = c; });
      if (!S.err && badVid) { S.err = 'Fix the highlighted YouTube link, or clear it.'; S.draft.items.forEach((i, k) => { i.__bad = b.items[k].__bad; }); }
      if (S.err) { renderModal(); break; }
      b.name = String(b.name).trim();
      b.items.forEach(i => { delete i.__bad; i.sets = Math.max(1, Number(i.sets) || 1); i.reps = Math.max(1, Number(i.reps) || 1); i.weighted = i.unit === 'check' ? false : !!i.weighted; });
      const addDay = S.modal.addDay, ck = dstr(S.pweek ? parseD(S.pweek) : mondayOf(new Date()));
      S.modal = null; S.draft = null;
      editPlan(p => {
        const i = p.blocks.findIndex(x => x.id === b.id); if (i >= 0) p.blocks[i] = b; else p.blocks.push(b);
        if (addDay != null) { p.weeks = p.weeks || {}; p.weeks[ck] = p.weeks[ck] || emptyWeek(); p.weeks[ck]['d' + addDay].push(b.id); }
      });
      showToast('Block saved'); break;
    }
    case 'delblock': {
      const bid = S.draft.id;
      S.modal = { type: 'confirm', title: 'Delete this block?', body: 'It is removed from every day it is used on. Past activity stays in the history.', yes: 'Delete block', danger: true,
        fn: () => editPlan(p => { p.blocks = p.blocks.filter(x => x.id !== bid); Object.keys(p.weeks || {}).forEach(k => Object.keys(p.weeks[k]).forEach(dk => { p.weeks[k][dk] = p.weeks[k][dk].filter(x => x !== bid); })); }) };
      renderModal(); break;
    }
    case 'reviewed': editPlan(p => { p.painReviewedAt = Date.now(); }); showToast('Marked as reviewed'); break;
    case 'saveprofile': {
      const D = S.draft;
      if (!String(D.name).trim()) { showToast('A name is needed'); break; }
      editPlan(p => { ['name', 'age', 'injury', 'goal', 'physio', 'physioEmail', 'note', 'appointment', 'started'].forEach(k => { p[k] = D[k]; }); if (!p.started) p.started = dstr(mondayOf(new Date())); });
      S.draft = null; showToast('Profile saved'); break;
    }
    case 'archive': {
      S.modal = { type: 'confirm', title: 'Archive ' + P.name + '?', body: 'They move out of your main list and their code stops working. Their plan and history are kept. Find them under Archived and restore them any time.', yes: 'Archive patient',
        fn: () => { editPlan(p => { p.archived = true; p.archivedAt = Date.now(); }); S.sel = null; S.draft = null; S.pview = 'patients'; render(); showToast('Archived. Find them under Archived.'); } };
      renderModal(); break;
    }
    case 'restore': { editPlan(p => { p.archived = false; delete p.archivedAt; }); S.draft = null; render(); showToast('Restored. They can sign in again.'); break; }
    case 'delpatient': {
      const id = S.sel;
      S.modal = { type: 'confirm', title: 'Delete ' + P.name + '?', body: 'Their plan and all their activity are removed for good, and their code stops working.', yes: 'Delete patient', danger: true,
        fn: async () => { S.sel = null; S.draft = null; delete S.plans[id]; delete S.logs[id]; render(); try { await Store.delDoc('patients', id); await Store.delDoc('logs', id); } catch (x) { reportErr(x); } } };
      renderModal(); break;
    }
    case 'newpatient': S.draft = { name: '', age: '', injury: '', goal: '', template: 'acl' }; S.err = ''; S.modal = { type: 'newpatient' }; renderModal(); break;
    case 'createpatient': {
      const D = S.draft;
      if (!String(D.name).trim()) { S.err = 'Add their first name.'; renderModal(); break; }
      const plan = buildPlan({ name: String(D.name).trim(), age: D.age, injury: D.injury, goal: D.goal, template: D.template, physio: 'Your physio' }, new Date());
      while (S.plans[plan.id]) { const c = makeCode(plan.name); plan.code = c; plan.id = c.toLowerCase(); }
      S.draft = null; S.err = ''; S.modal = { type: 'invite', id: plan.id };
      S.plans[plan.id] = plan; render();
      try { await Store.setDoc('patients', plan.id, plan); await Store.setDoc('logs', plan.id, { id: plan.id, log: {} }); } catch (x) { reportErr(x); }
      break;
    }
    case 'openfromInvite': { const id = S.modal.id; S.modal = null; S.sel = id; S.ptab = 'plan'; S.pweek = ''; render(); break; }
    case 'mclose': S.modal = null; S.draft = (S.ptab === 'profile') ? S.draft : null; renderModal(); break;
    case 'myes': { const fn = S.modal.fn; S.modal = null; renderModal(); if (fn) fn(); break; }
  }
});

/* ===== start ===== */
(async function boot() {
  await Store.init();
  await ensureSample();
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); } catch (e) {}
  if (saved && saved.role === 'physio') enterPhysio();
  else if (saved && saved.role === 'patient' && saved.code) enterPatient(saved.code);
  else render();
})();

</script>
</body></html>
